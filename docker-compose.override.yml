# Local overrides — keep services internal-only (reached via shared Caddy network).
# Not tracked upstream, survives git pull.
services:
  # Bot disabled for now: server blocks most Telegram IPs (IPv6 dead).
  # Re-enable after setting up WARP/proxy egress.
  bot:
    image: agellar/remnawave-admin-bot:sha256-a2659e7ccbdbb173e95a45e81cb5c5f9831d6692d7a75b503958b277958b35bc
    deploy:
      replicas: 0
    ports: !reset []

  web-backend:
    image: agellar/remnawave-admin-web-backend:sha256-d5de1b72109a2967710d5f4bdcbd7d8f50c1d4f1b06bfd366dd8486b60822fee
    ports: !reset []
    depends_on:
      bedolaga-tunnel:
        condition: service_started
    environment:
      RWA_LIVE_FLOW_MAX_USERS: "5000"
      RWA_LIVE_FLOW_USERS_PAGE: "500"

  web-collector:
    image: agellar/remnawave-admin-web-backend:sha256-d5de1b72109a2967710d5f4bdcbd7d8f50c1d4f1b06bfd366dd8486b60822fee

  web-frontend:
    image: agellar/remnawave-admin-web-frontend:sha256-e50aae68b3516a777bb4b71cae0d4a8c8e02a00c25d3b6fa209fc0eb08eb0c29
    ports: !reset []

  # Приватный канал к Bedolaga Bot Web API на 193.53.40.18.
  # Тот API слушает только 127.0.0.1, наружу не выставлен — ходим через SSH.
  # Порт 8080 контейнера виден лишь внутри remnawave-network.
  bedolaga-tunnel:
    build: ./tunnel
    image: bedolaga-api-tunnel:local
    container_name: bedolaga-api-tunnel
    restart: unless-stopped
    networks:
      - remnawave-network
    volumes:
      - ./tunnel/keys:/keys:ro
