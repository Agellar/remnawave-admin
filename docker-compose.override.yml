# Local overrides — keep services internal-only (reached via shared Caddy network).
# Not tracked upstream, survives git pull.
services:
  # Bot disabled for now: server blocks most Telegram IPs (IPv6 dead).
  # Re-enable after setting up WARP/proxy egress.
  bot:
    image: agellar/remnawave-admin-bot:sha256-08b680d020a03767ee553a955d137591f905280d80260d6ea0a8d83bdfb55b43
    deploy:
      replicas: 0
    ports: !reset []

  web-backend:
    image: agellar/remnawave-admin-web-backend:sha256-cfca937ec934b2c3f4e233242d63a43289309e15d4bf2234bdba15dc3f2e7c35
    ports: !reset []
    depends_on:
      bedolaga-tunnel:
        condition: service_started
    environment:
      RWA_LIVE_FLOW_MAX_USERS: "5000"
      RWA_LIVE_FLOW_USERS_PAGE: "500"

  web-collector:
    image: agellar/remnawave-admin-web-backend:sha256-cfca937ec934b2c3f4e233242d63a43289309e15d4bf2234bdba15dc3f2e7c35

  web-frontend:
    image: agellar/remnawave-admin-web-frontend:sha256-ed603809005d2f8e38e37968e25c497a350d4c0fe74c24490050e1e4d1509bb9
    ports: !reset []

  # Приватный канал к Bedolaga Bot Web API на 193.53.40.18.
  # Тот API слушает только 127.0.0.1, наружу не выставлен — ходим через SSH.
  # Порт 8080 контейнера виден лишь внутри remnawave-network.
  bedolaga-tunnel:
    build: ./tunnel
    image: bedolaga-api-tunnel:local
    container_name: bedolaga-api-tunnel
    restart: unless-stopped
    networks:
      - remnawave-network
    volumes:
      - ./tunnel/keys:/keys:ro
