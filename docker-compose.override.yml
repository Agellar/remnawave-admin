# Local overrides — keep services internal-only (reached via shared Caddy network).
# Not tracked upstream, survives git pull.
services:
  # Bot disabled for now: server blocks most Telegram IPs (IPv6 dead).
  # Re-enable after setting up WARP/proxy egress.
  bot:
    image: agellar/remnawave-admin-bot:sha256-236f69e7c0fd3035f838d616200b00a8c49d2ab6ca29a7b1f732f0f05211b19b
    deploy:
      replicas: 0
    ports: !reset []

  web-backend:
    image: agellar/remnawave-admin-web-backend:sha256-e5d2452ab143b1d93644b4d4f9c969e783e4cbb138e43e84a22304e2abb76866
    # QCode inference/usage credentials and backend-only plugin settings.
    # Compose appends this after the base .env, so secrets are not exposed to
    # the bot, frontend or optional collector services.
    env_file:
      - .env.backend-secrets
    ports: !reset []
    depends_on:
      bedolaga-tunnel:
        condition: service_started
    environment:
      RWA_LIVE_FLOW_MAX_USERS: "5000"
      RWA_LIVE_FLOW_USERS_PAGE: "500"

  web-collector:
    image: agellar/remnawave-admin-web-backend:sha256-e5d2452ab143b1d93644b4d4f9c969e783e4cbb138e43e84a22304e2abb76866

  web-frontend:
    image: agellar/remnawave-admin-web-frontend:sha256-d21cc60b559fb8029dc3dcdea8f7269d75a06be6cd9844b4d392e07b06ae5d9f
    ports: !reset []

  # Приватный канал к Bedolaga Bot Web API на 193.53.40.18.
  # Тот API слушает только 127.0.0.1, наружу не выставлен — ходим через SSH.
  # Порт 8080 контейнера виден лишь внутри remnawave-network.
  bedolaga-tunnel:
    build: ./tunnel
    image: bedolaga-api-tunnel:local
    container_name: bedolaga-api-tunnel
    restart: unless-stopped
    networks:
      - remnawave-network
    volumes:
      - ./tunnel/keys:/keys:ro
